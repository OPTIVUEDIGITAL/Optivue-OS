name: Design QA

on:
  push:
    branches:
      - main
    paths:
      - "production/**"
      - "scripts/**"
      - ".github/workflows/design-qa.yml"
  pull_request:
    paths:
      - "production/**"
      - "scripts/**"
      - ".github/workflows/design-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  design-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Contrast audit
        run: python3 scripts/contrast.py

      - name: Install browser QA tools
        run: |
          npm install --no-save playwright@1.55.0 lighthouse@12.2.1
          npx playwright install --with-deps chromium

      - name: Serve production
        run: |
          node scripts/qa-server.mjs > /tmp/optivue-http.log 2>&1 &
          echo $! > /tmp/optivue-http.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8787/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/optivue-http.log
          exit 1

      - name: Responsive screenshots and overflow checks
        run: node scripts/visual-qa.mjs

      - name: Pricing breakdown acceptance
        run: node scripts/pricing-qa.mjs

      - name: Founding program ON and OFF acceptance
        run: node scripts/founding-qa.mjs

      - name: Phone experience acceptance
        run: node scripts/mobile-qa.mjs

      - name: Lighthouse mobile (3 runs)
        run: |
          for i in 1 2 3; do
            npx lighthouse http://127.0.0.1:8787 \
              --output=json \
              --output-path="lighthouse-$i.json" \
              --only-categories=performance,accessibility \
              --form-factor=mobile \
              --screenEmulation.mobile=true \
              --chrome-flags="--headless --no-sandbox --disable-gpu"
          done

      - name: Enforce Lighthouse budgets
        run: node scripts/check-lighthouse.mjs

      - name: Upload design QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optivue-design-qa
          path: |
            shots/
            shots-mobile/
            lighthouse-*.json
          if-no-files-found: warn
