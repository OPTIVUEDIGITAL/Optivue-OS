name: Mobile Pass Desktop Equivalence

on:
  push:
    branches:
      - mobile/p3-phone-experience-v2
    paths:
      - ".github/workflows/mobile-desktop-equivalence.yml"

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture deterministic baseline and head
        env:
          BASE_SHA: 894c24536ca55a267012069332524e16f6bd45b6
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p desktop-equivalence

          capture() {
            ref="$1"
            output="$2"
            git checkout --force "$ref"
            node scripts/qa-server.mjs > "/tmp/qa-$output.log" 2>&1 &
            pid=$!
            for i in {1..20}; do
              if curl -fsS http://127.0.0.1:8787/ >/dev/null; then break; fi
              sleep 1
            done
            node --input-type=module - "$output" <<'NODE'
          import { chromium } from "playwright";
          const output = process.argv[2];
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({
            viewport: { width: 1440, height: 900 },
            reducedMotion: "reduce",
          });
          await page.goto("http://127.0.0.1:8787", { waitUntil: "networkidle" });
          await page.waitForTimeout(500);
          await page.screenshot({ path: `desktop-equivalence/${output}.png`, fullPage: true });
          await browser.close();
          NODE
            kill "$pid" || true
            wait "$pid" 2>/dev/null || true
          }

          capture "$BASE_SHA" before
          capture "$HEAD_SHA" after

          sha256sum desktop-equivalence/before.png desktop-equivalence/after.png
          if ! cmp -s desktop-equivalence/before.png desktop-equivalence/after.png; then
            echo "Desktop reduced-motion screenshots are not byte-identical."
            exit 1
          fi
          echo "Desktop reduced-motion screenshots are byte-identical."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-equivalence
          path: desktop-equivalence/
