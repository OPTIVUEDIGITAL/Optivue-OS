name: P2 Generate Webfonts

on:
  push:
    branches:
      - type/p2-typography
    paths:
      - ".github/workflows/p2-generate-webfonts.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: type/p2-typography

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install font conversion tools
        run: python -m pip install --disable-pip-version-check fonttools brotli

      - name: Download official font sources
        run: |
          mkdir -p /tmp/optivue-fonts production/assets/fonts
          curl -L --fail --retry 3 "https://raw.githubusercontent.com/google/fonts/main/ofl/archivo/Archivo%5Bwdth%2Cwght%5D.ttf" -o /tmp/optivue-fonts/archivo.ttf
          curl -L --fail --retry 3 "https://raw.githubusercontent.com/google/fonts/main/ofl/inter/Inter%5Bopsz%2Cwght%5D.ttf" -o /tmp/optivue-fonts/inter.ttf
          curl -L --fail --retry 3 "https://raw.githubusercontent.com/google/fonts/main/ofl/ibmplexmono/IBMPlexMono-Medium.ttf" -o /tmp/optivue-fonts/ibm-plex-mono-medium.ttf

      - name: Convert sources to WOFF2
        run: |
          python - <<'PY'
          from fontTools.ttLib import TTFont
          pairs = [
              ("/tmp/optivue-fonts/archivo.ttf", "production/assets/fonts/archivo-variable.woff2"),
              ("/tmp/optivue-fonts/inter.ttf", "production/assets/fonts/inter-variable.woff2"),
              ("/tmp/optivue-fonts/ibm-plex-mono-medium.ttf", "production/assets/fonts/ibm-plex-mono-medium.woff2"),
          ]
          for src, dst in pairs:
              font = TTFont(src)
              font.flavor = "woff2"
              font.save(dst)
          PY

      - name: Commit generated webfonts
        run: |
          git config user.name "Optivue Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add production/assets/fonts/*.woff2
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Self-host P2 webfonts"
          git push origin HEAD:type/p2-typography
