name: P2 Typography Verification

on:
  push:
    branches:
      - type/p2-typography
    paths:
      - ".github/workflows/p2-verify-typography.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start static server
        run: |
          python3 -m http.server 8787 --directory production > /tmp/optivue-http.log 2>&1 &
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:8787/ >/dev/null && break
            sleep 1
          done

      - name: Run Lighthouse
        run: |
          npx --yes lighthouse@12.5.1 http://127.0.0.1:8787/             --only-categories=performance,accessibility             --output=json             --output-path=/tmp/lighthouse.json             --chrome-flags="--headless --no-sandbox --disable-gpu"

      - name: Enforce P2 CLS budget
        run: |
          python3 - <<'PY'
          import json
          with open('/tmp/lighthouse.json') as f:
              report=json.load(f)
          cls=report['audits']['cumulative-layout-shift']['numericValue']
          perf=report['categories']['performance']['score']
          a11y=report['categories']['accessibility']['score']
          print(f"CLS={cls:.5f}")
          print(f"Performance={perf*100:.0f}")
          print(f"Accessibility={a11y*100:.0f}")
          if cls >= 0.05:
              raise SystemExit(f"P2 FAIL: CLS {cls:.5f} is not < 0.05")
          PY
