name: P3 Mobile Verification

on:
  push:
    branches:
      - mobile/p3-phone-experience
    paths:
      - "production/**"
      - ".github/workflows/p3-mobile-verify.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          python3 -m pip install --quiet pillow

      - name: Prepare pre-mobile baseline
        run: git worktree add /tmp/optivue-baseline 5ce2b140d89b5b1cfa7384fb301cd1300c63241e

      - name: Serve current and baseline
        run: |
          python3 -m http.server 8787 --directory production >/tmp/current-http.log 2>&1 &
          python3 -m http.server 8788 --directory /tmp/optivue-baseline/production >/tmp/baseline-http.log 2>&1 &
          for port in 8787 8788; do
            for i in {1..20}; do
              if curl -fsS "http://127.0.0.1:$port/" >/dev/null; then break; fi
              sleep 1
            done
            curl -fsS "http://127.0.0.1:$port/" >/dev/null
          done

      - name: Run phone interaction and visual QA
        run: |
          cat > /tmp/mobile-qa.mjs <<'JS'
          import { chromium } from "playwright";
          import fs from "node:fs/promises";

          const CURRENT = "http://127.0.0.1:8787";
          const BASELINE = "http://127.0.0.1:8788";
          await fs.mkdir("shots-mobile", { recursive: true });

          const browser = await chromium.launch({ headless: true });
          const results = { screenshots: {}, phone: {}, deterministic: {}, failures: [] };

          async function stablePage(base, width, height) {
            const context = await browser.newContext({
              viewport: { width, height },
              colorScheme: "dark",
              reducedMotion: "reduce",
            });
            const page = await context.newPage();
            await page.goto(base, { waitUntil: "networkidle" });
            await page.evaluate(() => document.fonts?.ready);
            await page.waitForTimeout(250);
            return { context, page };
          }

          for (const vp of [
            ["m-390", 390, 844],
            ["m-430", 430, 932],
            ["t-768", 768, 1024],
            ["d-1440", 1440, 900],
          ]) {
            const [name, width, height] = vp;
            const { context, page } = await stablePage(CURRENT, width, height);
            const metrics = await page.evaluate(() => ({
              innerWidth: innerWidth,
              docWidth: document.documentElement.scrollWidth,
              bodyWidth: document.body.scrollWidth,
              mobileCtaCount: document.querySelectorAll(".ovgo-mobile-cta").length,
              mobileDotsCount: document.querySelectorAll(".ovgo-carousel-dots").length,
              mobileWorkDetails: document.querySelectorAll(".ovgo-work-mobile-detail").length,
            }));
            results.screenshots[name] = metrics;
            if (Math.max(metrics.docWidth, metrics.bodyWidth) > width + 1) {
              results.failures.push(name + ": horizontal page overflow");
            }
            if (width > 760 && (metrics.mobileCtaCount || metrics.mobileDotsCount || metrics.mobileWorkDetails)) {
              results.failures.push(name + ": mobile-only DOM rendered above 760px");
            }
            await page.screenshot({ path: "shots-mobile/" + name + ".png", fullPage: true });
            await context.close();
          }

          for (const [name, width, height] of [["t-768",768,1024],["d-1440",1440,900]]) {
            const before = await stablePage(BASELINE, width, height);
            await before.page.screenshot({ path: "shots-mobile/" + name + "-before.png", fullPage: true });
            await before.context.close();
            const after = await stablePage(CURRENT, width, height);
            await after.page.screenshot({ path: "shots-mobile/" + name + "-after.png", fullPage: true });
            await after.context.close();
          }

          const context = await browser.newContext({
            viewport: { width: 390, height: 844 },
            colorScheme: "dark",
            reducedMotion: "no-preference",
          });
          const page = await context.newPage();
          await page.goto(CURRENT, { waitUntil: "networkidle" });
          await page.evaluate(() => document.fonts?.ready);
          await page.waitForTimeout(350);

          const initial = await page.evaluate(() => {
            const cta = document.querySelector(".ovgo-mobile-cta");
            const growth = document.querySelector("optivue-growth-system");
            const footer = document.querySelector(".ovgo-hero__footer");
            const stageGrid = document.querySelector(".ovgo-stage-grid");
            const pricingGrid = document.querySelector(".ovgo-pricing-grid");

            const targetIssues = [];
            const targets = [...document.querySelectorAll('a[href],button,input:not([type="hidden"]),select,textarea,[tabindex="0"]')];
            for (const el of targets) {
              const style = getComputedStyle(el);
              const rect = el.getBoundingClientRect();
              if (style.display === "none" || style.visibility === "hidden" || rect.width === 0 || rect.height === 0) continue;
              if (el.matches('input[type="checkbox"],input[type="radio"]') && el.closest(".ovgo-choice,.ovgo-consent")) continue;
              if (rect.width < 43.5 || rect.height < 43.5) {
                targetIssues.push({
                  tag: el.tagName,
                  cls: el.className,
                  text: (el.textContent || el.getAttribute("aria-label") || "").trim().slice(0,60),
                  width: rect.width,
                  height: rect.height,
                });
              }
            }

            const formFontIssues = [...document.querySelectorAll('input:not([type="checkbox"]):not([type="radio"]),select,textarea')]
              .map(el => ({ id: el.id, size: parseFloat(getComputedStyle(el).fontSize) }))
              .filter(x => x.size < 16);

            const gapSelectors = [".ovgo-header__actions",".ovgo-filter-row",".ovgo-actions",".ovgo-lead-actions",".ovgo-stage-grid",".ovgo-pricing-grid"];
            const gapIssues = gapSelectors.flatMap(selector => [...document.querySelectorAll(selector)].map(el => {
              const style = getComputedStyle(el);
              const row = parseFloat(style.rowGap || "0");
              const col = parseFloat(style.columnGap || "0");
              return { selector, row, col };
            })).filter(x => Math.max(x.row, x.col) < 8);

            const blurred = [...document.querySelectorAll("*")].map(el => {
              const s = getComputedStyle(el);
              const value = s.backdropFilter || s.webkitBackdropFilter || "none";
              return { cls: el.className, value };
            }).filter(x => x.value && x.value !== "none");

            return {
              ctaExists: Boolean(cta),
              ctaInitiallyVisible: Boolean(cta?.classList.contains("is-visible")),
              targetIssues,
              formFontIssues,
              gapIssues,
              blurred,
              footerDisplay: footer ? getComputedStyle(footer).display : "missing",
              stageDots: document.querySelectorAll(".ovgo-carousel-dot").length,
              firstWorkExpanded: document.querySelector("[data-work-title]")?.getAttribute("aria-expanded"),
              firstWorkPanelVisible: (() => {
                const b = document.querySelector("[data-work-title]");
                const id = b?.getAttribute("aria-controls");
                return Boolean(id && !document.getElementById(id)?.hidden);
              })(),
              featuredFirst: (() => {
                const cards = [...document.querySelectorAll(".ovgo-pricing-grid .ovgo-price-card")];
                return cards.map(card => ({ plan: card.dataset.pricePlan, left: card.getBoundingClientRect().left }))
                  .sort((a,b) => a.left-b.left)[0]?.plan;
              })(),
              hero: growth ? {
                mobile: growth._mobile,
                edgeCount: growth._renderEdges?.length,
                nodeCount: growth._nodeEls?.length,
                rafRunning: Boolean(growth._raf),
                visible: growth._visible,
              } : null,
              stageOverflow: stageGrid ? getComputedStyle(stageGrid).overflowX : null,
              pricingOverflow: pricingGrid ? getComputedStyle(pricingGrid).overflowX : null,
              viewportMeta: document.querySelector('meta[name="viewport"]')?.content || "",
            };
          });

          results.phone.initial = initial;
          if (!initial.ctaExists) results.failures.push("390: sticky CTA not rendered");
          if (initial.ctaInitiallyVisible) results.failures.push("390: sticky CTA visible before hero exits");
          if (initial.targetIssues.length) results.failures.push("390: tappable targets under 44px: " + JSON.stringify(initial.targetIssues));
          if (initial.formFontIssues.length) results.failures.push("390: form text below 16px: " + JSON.stringify(initial.formFontIssues));
          if (initial.gapIssues.length) results.failures.push("390: interactive group gap below 8px: " + JSON.stringify(initial.gapIssues));
          if (initial.blurred.some(x => !String(x.cls).includes("ovgo-mobile-cta"))) results.failures.push("390: backdrop blur exists outside sticky CTA: " + JSON.stringify(initial.blurred));
          if (initial.footerDisplay === "none" || initial.footerDisplay === "missing") results.failures.push("390: hero footer still hidden");
          if (initial.stageDots !== 5) results.failures.push("390: expected 5 stage dots, found " + initial.stageDots);
          if (initial.firstWorkExpanded !== "true" || !initial.firstWorkPanelVisible) results.failures.push("390: first Work item is not open by default");
          if (initial.featuredFirst !== "Growth Accelerator") results.failures.push("390: featured pricing tier is not visually first");
          if (!initial.hero?.mobile || initial.hero.edgeCount !== 5 || initial.hero.nodeCount !== 6) results.failures.push("390: hero SVG mobile simplification did not apply");
          if (initial.stageOverflow !== "auto" || initial.pricingOverflow !== "auto") results.failures.push("390: carousels are not native overflow scrollers");
          if (/user-scalable\s*=\s*no/i.test(initial.viewportMeta)) results.failures.push("390: viewport disables zoom");

          // Sticky CTA appears after hero exits.
          await page.locator("#systems").scrollIntoViewIfNeeded();
          await page.waitForTimeout(450);
          const afterHero = await page.evaluate(() => document.querySelector(".ovgo-mobile-cta")?.classList.contains("is-visible"));
          results.phone.ctaAfterHero = afterHero;
          if (!afterHero) results.failures.push("390: sticky CTA did not reveal after hero exit");
          await page.screenshot({ path: "shots-mobile/cta-390.png" });

          // Booking modal hides the CTA.
          await page.locator(".ovgo-mobile-cta [data-ovgo-booking]").click();
          await page.waitForTimeout(150);
          const modalState = await page.evaluate(() => ({
            modalOpen: !document.querySelector("[data-ovgo-modal]")?.hidden,
            ctaVisible: document.querySelector(".ovgo-mobile-cta")?.classList.contains("is-visible"),
          }));
          results.phone.modalState = modalState;
          if (!modalState.modalOpen || modalState.ctaVisible) results.failures.push("390: sticky CTA did not hide for booking modal");
          await page.locator("[data-ovgo-modal-close]").last().click();
          await page.waitForTimeout(100);

          // Mobile menu hides the CTA.
          await page.locator("[data-ovgo-menu-toggle]").click();
          await page.waitForTimeout(100);
          const menuState = await page.evaluate(() => ({
            menuOpen: document.querySelector("[data-ovgo-menu-toggle]")?.getAttribute("aria-expanded") === "true",
            ctaVisible: document.querySelector(".ovgo-mobile-cta")?.classList.contains("is-visible"),
          }));
          results.phone.menuState = menuState;
          if (!menuState.menuOpen || menuState.ctaVisible) results.failures.push("390: sticky CTA did not hide for mobile menu");
          await page.locator("[data-ovgo-menu-toggle]").click();
          await page.waitForTimeout(100);

          // Form focus hides the CTA and all form controls remain >=16px.
          await page.locator("#est-need").focus();
          await page.waitForTimeout(100);
          const formState = await page.evaluate(() => ({
            ctaVisible: document.querySelector(".ovgo-mobile-cta")?.classList.contains("is-visible"),
            active: document.activeElement?.id,
          }));
          results.phone.formState = formState;
          if (formState.ctaVisible || formState.active !== "est-need") results.failures.push("390: sticky CTA did not hide during form focus");

          // Stage dots follow native scrolling.
          await page.locator("#systems").scrollIntoViewIfNeeded();
          await page.evaluate(() => {
            const grid = document.querySelector(".ovgo-stage-grid");
            grid.scrollTo({ left: grid.clientWidth * 0.9, behavior: "auto" });
          });
          await page.waitForTimeout(180);
          const dotIndex = await page.evaluate(() => [...document.querySelectorAll(".ovgo-carousel-dot")].findIndex(x => x.classList.contains("is-active")));
          results.phone.stageDotIndexAfterScroll = dotIndex;
          if (dotIndex < 1) results.failures.push("390: stage dot indicator did not update after scroll");
          await page.screenshot({ path: "shots-mobile/stages-390.png" });

          // Work item opens detail inline in the same viewport.
          await page.locator("#work").scrollIntoViewIfNeeded();
          const secondWork = page.locator("[data-work-title]").nth(1);
          await secondWork.click();
          await page.waitForTimeout(600);
          const workState = await page.evaluate(() => {
            const buttons = [...document.querySelectorAll("[data-work-title]")];
            const second = buttons[1];
            const panel = document.getElementById(second?.getAttribute("aria-controls") || "");
            const rect = panel?.getBoundingClientRect();
            return {
              expanded: second?.getAttribute("aria-expanded"),
              visible: Boolean(panel && !panel.hidden),
              panelTop: rect?.top ?? null,
              panelBottom: rect?.bottom ?? null,
              viewport: innerHeight,
            };
          });
          results.phone.workState = workState;
          if (workState.expanded !== "true" || !workState.visible || workState.panelTop === null || workState.panelTop >= workState.viewport || workState.panelBottom <= 0) {
            results.failures.push("390: Work detail did not open visibly inline");
          }
          await page.screenshot({ path: "shots-mobile/work-390.png" });

          // Hero loop stops when its SVG leaves the viewport.
          await page.locator("#work").scrollIntoViewIfNeeded();
          await page.waitForTimeout(250);
          const heroOffscreen = await page.evaluate(() => {
            const growth = document.querySelector("optivue-growth-system");
            return { visible: growth?._visible, raf: growth?._raf ?? null };
          });
          results.phone.heroOffscreen = heroOffscreen;
          if (heroOffscreen.visible !== false || heroOffscreen.raf !== null) results.failures.push("390: hero animation loop did not stop off-screen");

          // Native horizontal scrollers are keyboard-scrollable when focused.
          const keyboard = {};
          await page.locator(".ovgo-stage-grid").focus();
          keyboard.stageBefore = await page.locator(".ovgo-stage-grid").evaluate(el => el.scrollLeft);
          await page.keyboard.press("ArrowRight");
          await page.waitForTimeout(250);
          keyboard.stageAfter = await page.locator(".ovgo-stage-grid").evaluate(el => el.scrollLeft);

          await page.locator("#pricing").scrollIntoViewIfNeeded();
          await page.locator(".ovgo-pricing-grid").focus();
          keyboard.pricingBefore = await page.locator(".ovgo-pricing-grid").evaluate(el => el.scrollLeft);
          await page.keyboard.press("ArrowRight");
          await page.waitForTimeout(250);
          keyboard.pricingAfter = await page.locator(".ovgo-pricing-grid").evaluate(el => el.scrollLeft);
          results.phone.keyboard = keyboard;
          if (!(keyboard.stageAfter > keyboard.stageBefore)) results.failures.push("390: stage carousel did not arrow-key scroll");
          if (!(keyboard.pricingAfter > keyboard.pricingBefore)) results.failures.push("390: pricing carousel did not arrow-key scroll");
          await page.screenshot({ path: "shots-mobile/pricing-390.png" });

          const cssText = await page.evaluate(() => fetch("./css/optivue-v2.css").then(r => r.text()));
          if (!cssText.includes("env(safe-area-inset-bottom)")) results.failures.push("phone CSS: safe-area inset missing");

          await context.close();

          // Reduced-motion behavior.
          const reduced = await browser.newContext({
            viewport: { width: 390, height: 844 },
            colorScheme: "dark",
            reducedMotion: "reduce",
          });
          const reducedPage = await reduced.newPage();
          await reducedPage.goto(CURRENT, { waitUntil: "networkidle" });
          await reducedPage.waitForTimeout(200);
          const reducedState = await reducedPage.evaluate(() => {
            const growth = document.querySelector("optivue-growth-system");
            const cta = document.querySelector(".ovgo-mobile-cta");
            const stage = document.querySelector(".ovgo-stage-grid");
            return {
              heroReduced: growth?._reduced,
              heroRaf: growth?._raf ?? null,
              ctaTransition: cta ? getComputedStyle(cta).transitionDuration : null,
              stageSnap: stage ? getComputedStyle(stage).scrollSnapType : null,
            };
          });
          results.phone.reducedMotion = reducedState;
          if (!reducedState.heroReduced || reducedState.heroRaf !== null) results.failures.push("reduced motion: hero is still animating");
          if (reducedState.ctaTransition && reducedState.ctaTransition !== "0s") results.failures.push("reduced motion: sticky CTA transition still enabled");
          if (reducedState.stageSnap !== "x proximity") results.failures.push("reduced motion: carousel snap was not relaxed");
          await reduced.close();

          await browser.close();
          await fs.writeFile("shots-mobile/mobile-qa-results.json", JSON.stringify(results, null, 2));
          console.log(JSON.stringify(results, null, 2));
          if (results.failures.length) process.exit(1);
          JS
          node /tmp/mobile-qa.mjs

      - name: Prove tablet and desktop pixels unchanged
        run: |
          python3 - <<'PY'
          from PIL import Image, ImageChops
          from pathlib import Path
          import json

          results = {}
          failed = False
          for name in ("t-768", "d-1440"):
              before = Image.open(f"shots-mobile/{name}-before.png").convert("RGBA")
              after = Image.open(f"shots-mobile/{name}-after.png").convert("RGBA")
              if before.size != after.size:
                  results[name] = {"same_size": False, "before": before.size, "after": after.size}
                  failed = True
                  continue
              diff = ImageChops.difference(before, after)
              bbox = diff.getbbox()
              results[name] = {"same_size": True, "pixel_identical": bbox is None}
              if bbox is not None:
                  diff.save(f"shots-mobile/{name}-diff.png")
                  failed = True

          Path("shots-mobile/desktop-tablet-diff.json").write_text(json.dumps(results, indent=2))
          print(json.dumps(results, indent=2))
          if failed:
              raise SystemExit(1)
          PY

      - name: Upload mobile QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3-mobile-qa
          path: shots-mobile/
          if-no-files-found: error
