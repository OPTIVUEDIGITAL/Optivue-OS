name: P3 Composition Verification

on:
  push:
    branches:
      - layout/p3-composition
    paths:
      - ".github/workflows/p3-verify-composition.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start static server
        run: |
          python3 -m http.server 8787 --directory production > /tmp/optivue-http.log 2>&1 &
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:8787/ >/dev/null && break
            sleep 1
          done

      - name: Capture required viewports and focused sections
        run: |
          mkdir -p shots/p3
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const cases = [
              {name:'390', width:390, height:844},
              {name:'768', width:768, height:1024},
              {name:'1440', width:1440, height:900},
            ];
            let failed = false;
            for (const v of cases) {
              const page = await browser.newPage({viewport:{width:v.width,height:v.height}, deviceScaleFactor:1});
              await page.goto('http://127.0.0.1:8787/', {waitUntil:'networkidle'});
              await page.screenshot({path:`shots/p3/${v.name}.png`, fullPage:true});
              const metrics = await page.evaluate(() => {
                const rect = sel => {
                  const el=document.querySelector(sel);
                  if(!el) return null;
                  const r=el.getBoundingClientRect();
                  return {left:r.left,right:r.right,width:r.width,top:r.top+scrollY,height:r.height};
                };
                return {
                  scrollWidth: document.documentElement.scrollWidth,
                  clientWidth: document.documentElement.clientWidth,
                  heroPanel: rect('.ovgo-hero__content'),
                  clientWork: rect('#transformations'),
                  diagnosis: rect('#diagnosis'),
                  estimator: rect('#estimator')
                };
              });
              console.log(`${v.name}px ${JSON.stringify(metrics)}`);
              if (metrics.scrollWidth > metrics.clientWidth + 1) failed = true;

              const snap = async (selector, path) => {
                const loc = page.locator(selector);
                await loc.scrollIntoViewIfNeeded();
                await page.waitForTimeout(750);
                await loc.screenshot({path});
              };
              if (v.name === '390') {
                await snap('.ovgo-hero__content','shots/p3/390-hero.png');
                await snap('#estimator','shots/p3/390-estimator.png');
              }
              if (v.name === '768') {
                await snap('#transformations','shots/p3/768-client-work.png');
              }
              if (v.name === '1440') {
                await snap('.ovgo-hero__content','shots/p3/1440-hero.png');
                await snap('#transformations','shots/p3/1440-client-work.png');
                await snap('#diagnosis','shots/p3/1440-diagnosis.png');
              }
              await page.close();
            }
            await browser.close();
            if (failed) process.exit(2);
          })();
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: p3-focused-shots
          path: shots/p3/*.png
          retention-days: 3
