name: P4 About Visual Review
# rerun after layout refinement

on:
  push:
    branches:
      - p4/about-section
    paths:
      - ".github/workflows/p4-about-visual.yml"

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Serve production
        run: |
          node scripts/qa-server.mjs > /tmp/optivue-http.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8787/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/optivue-http.log
          exit 1

      - name: Capture About at mobile and desktop
        run: |
          mkdir -p shots-about
          npx playwright screenshot --viewport-size="390,844" --wait-for-timeout=1200 "http://127.0.0.1:8787/#about" shots-about/about-390.png
          npx playwright screenshot --viewport-size="1440,900" --wait-for-timeout=1200 "http://127.0.0.1:8787/#about" shots-about/about-1440.png

      - uses: actions/upload-artifact@v4
        with:
          name: p4-about-visual
          path: shots-about/
