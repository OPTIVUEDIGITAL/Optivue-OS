name: Perf Subset Webfonts

on:
  push:
    branches:
      - perf/subset-webfonts
    paths:
      - ".github/workflows/perf-subset-webfonts.yml"

permissions:
  contents: write

jobs:
  subset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/subset-webfonts

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install font tools
        run: python -m pip install --disable-pip-version-check fonttools brotli

      - name: Download official font sources
        run: |
          mkdir -p /tmp/optivue-fonts production/assets/fonts
          curl -L --fail --retry 3 "https://raw.githubusercontent.com/google/fonts/main/ofl/archivo/Archivo%5Bwdth%2Cwght%5D.ttf" -o /tmp/optivue-fonts/archivo.ttf
          curl -L --fail --retry 3 "https://raw.githubusercontent.com/google/fonts/main/ofl/inter/Inter%5Bopsz%2Cwght%5D.ttf" -o /tmp/optivue-fonts/inter.ttf
          curl -L --fail --retry 3 "https://raw.githubusercontent.com/google/fonts/main/ofl/ibmplexmono/IBMPlexMono-Medium.ttf" -o /tmp/optivue-fonts/ibm-plex-mono-medium.ttf

      - name: Subset to site character set
        run: |
          RANGE='U+0020-007E,U+00A0-00FF,U+2000-206F,U+20A0-20CF,U+2100-214F,U+2190-21FF,U+25A0-25FF,U+2700-27BF'
          COMMON="--unicodes=$RANGE --layout-features=* --glyph-names --symbol-cmap --legacy-cmap --notdef-glyph --notdef-outline --recommended-glyphs --name-IDs=* --name-legacy --name-languages=* --flavor=woff2"
          pyftsubset /tmp/optivue-fonts/archivo.ttf $COMMON --output-file=production/assets/fonts/archivo-variable.woff2
          pyftsubset /tmp/optivue-fonts/inter.ttf $COMMON --output-file=production/assets/fonts/inter-variable.woff2
          pyftsubset /tmp/optivue-fonts/ibm-plex-mono-medium.ttf $COMMON --output-file=production/assets/fonts/ibm-plex-mono-medium.woff2

      - name: Report font sizes
        run: |
          ls -lh production/assets/fonts/*.woff2
          du -cb production/assets/fonts/*.woff2 | tail -1

      - name: Commit optimized fonts and remove generator
        run: |
          rm .github/workflows/perf-subset-webfonts.yml
          git config user.name "Optivue Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add production/assets/fonts/*.woff2 .github/workflows/perf-subset-webfonts.yml
          git commit -m "Subset self-hosted webfonts [skip ci]"
          git push origin HEAD:perf/subset-webfonts
