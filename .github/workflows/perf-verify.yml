name: Perf Verify

on:
  push:
    branches:
      - perf/subset-webfonts
    paths:
      - ".github/workflows/perf-verify.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/subset-webfonts
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Lighthouse
        run: npm install --no-save lighthouse@12.2.1
      - name: Serve production
        run: |
          python3 -m http.server 8787 --directory production > /tmp/http.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8787/ >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Run Lighthouse
        run: |
          npx lighthouse http://127.0.0.1:8787             --output=json             --output-path=/tmp/lighthouse.json             --only-categories=performance,accessibility             --form-factor=mobile             --screenEmulation.mobile=true             --chrome-flags="--headless --no-sandbox --disable-gpu"
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('/tmp/lighthouse.json','utf8'));
          const performance=Math.round(r.categories.performance.score*100);
          const accessibility=Math.round(r.categories.accessibility.score*100);
          const cls=r.audits['cumulative-layout-shift'].numericValue;
          const fcp=r.audits['first-contentful-paint'].numericValue;
          const lcp=r.audits['largest-contentful-paint'].numericValue;
          console.log(JSON.stringify({performance,accessibility,cls,fcp,lcp},null,2));
          if (performance < 90 || accessibility < 95 || cls >= 0.05) process.exit(1);
          NODE
