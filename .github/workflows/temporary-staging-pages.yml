name: Temporary Growth OS Staging

on:
  push:
    branches:
      - main
    paths:
      - "production/**"
      - ".github/workflows/temporary-staging-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "temporary-growth-os-staging"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload production site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./production

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
