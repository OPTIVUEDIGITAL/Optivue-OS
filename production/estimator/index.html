<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="See what stands between a lead and a booking. Answer 9 questions for a system snapshot and estimated cost range.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#090A0C">
  <link rel="canonical" href="https://growth.optivuedigital.com/estimator">
  <title>Growth System Scope Estimator | Optivue Growth OS</title>
  <link rel="stylesheet" href="../css/tokens.generated.css">
  <link rel="stylesheet" href="../css/optivue.css">
  <link rel="stylesheet" href="../css/optivue-v2.css">
</head>
<body>
  <div id="optivue-growth-os" class="ovgo-app ovgo-estimator-app" data-theme="dark">
    <header class="ovgo-header" data-ovgo-header>
      <a class="ovgo-brand" href="/" aria-label="Back to Optivue Growth OS"><span>OPTIVUE DIGITAL</span><small>[ GROWTH OS ]</small></a>
      <div class="ovgo-header__actions">
        <button class="ovgo-icon-btn" type="button" data-ovgo-theme aria-label="Toggle light and dark mode"><span aria-hidden="true">◐</span></button>
        <a class="ovgo-btn ovgo-btn--secondary ovgo-btn--compact" href="/">Back to Growth OS</a>
      </div>
    </header>
    <main>
      <section class="ovgo-estimator" data-ovgo-estimator-page aria-labelledby="estimator-title">
        <h1 id="estimator-title" class="ovgo-sr-only">Growth System Scope Estimator</h1>
        <div data-ovgo-estimator></div>
      </section>
    </main>
    <div class="ovgo-modal" data-ovgo-modal hidden>
      <div class="ovgo-modal__backdrop" data-ovgo-modal-close></div>
      <div class="ovgo-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="ovgo-booking-title">
        <div class="ovgo-modal__header"><div><p class="ovgo-kicker">Fit Call</p><h2 id="ovgo-booking-title">Find the next priority</h2></div><button type="button" class="ovgo-icon-btn" aria-label="Close booking modal" data-ovgo-modal-close>×</button></div>
        <iframe title="Schedule a Fit Call with Optivue Digital" data-ovgo-calendly loading="lazy"></iframe>
      </div>
    </div>
  </div>
  <script type="module" src="../js/optivue.js"></script>
</body>
</html>
