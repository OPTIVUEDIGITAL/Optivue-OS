<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Optivue | Desktop & Mobile Review</title><style>*{box-sizing:border-box}body{margin:0;background:#171c24;color:#eaf0f7;font:14px system-ui}header{min-height:64px;display:flex;gap:16px;align-items:center;justify-content:space-between;padding:12px 22px;flex-wrap:wrap;border-bottom:1px solid #354153}strong{font-size:14px}nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,a{font:inherit;color:inherit;border:1px solid #52627a;background:transparent;border-radius:8px;padding:10px 14px;cursor:pointer;text-decoration:none}button[aria-pressed=true]{background:#d6f55d;color:#12170b;border-color:#d6f55d}button:focus-visible,a:focus-visible{outline:3px solid #83b4ff;outline-offset:3px}main{display:flex;justify-content:center;height:calc(100dvh - 75px);padding:12px}iframe{width:100%;height:100%;border:1px solid #46536b;border-radius:12px;background:#090a0c;transition:width .2s}small{color:#aab6c8}@media(max-width:600px){header{padding:10px;gap:8px}main{padding:0;height:calc(100dvh - 114px)}iframe{border-radius:0}small{display:none}}@media(prefers-reduced-motion:reduce){iframe{transition:none}}</style></head><body><header><div><strong>OPTIVUE / DESIGN REVIEW</strong><br><small>Three updated sections. Live website unchanged.</small></div><nav aria-label="Preview size"><a href="/tracking-plan.html" target="_blank">Tracking plan</a><button data-size="100%" aria-pressed="true">Desktop</button><button data-size="390px" aria-pressed="false">Mobile · 390px</button><a href="/site.html#about" target="_blank" rel="noopener">Open full screen ↗</a></nav></header><main><iframe title="Responsive Optivue Growth OS preview" src="/site.html#about"></iframe></main><script>const frame=document.querySelector('iframe');document.querySelectorAll('button').forEach(button=>button.onclick=()=>{document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));frame.style.width=button.dataset.size;frame.style.maxWidth='100%'});</script><details id="event-monitor" style="position:fixed;bottom:12px;right:12px;z-index:10;background:#142136;border:1px solid #577199;border-radius:10px;padding:10px;max-width:min(480px,90vw)"><summary style="cursor:pointer">Local event monitor <span id="event-count">0</span></summary><p>Preview only. No events sent to Google.</p><ol id="event-log" style="max-height:220px;overflow:auto;font-size:12px"></ol></details><script>const previewFrame=document.querySelector('main iframe');let eventCount=0;previewFrame.addEventListener('load',()=>{previewFrame.contentWindow.addEventListener('optivue:analytics',e=>{eventCount++;document.querySelector('#event-count').textContent=eventCount;const li=document.createElement('li');li.textContent=e.detail.name+' '+JSON.stringify(e.detail.parameters);document.querySelector('#event-log').prepend(li);while(document.querySelector('#event-log').children.length>40)document.querySelector('#event-log').lastChild.remove();});});</script></body></html>
