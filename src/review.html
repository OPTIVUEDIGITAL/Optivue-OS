<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Optivue | Responsive Midnight Navy Review</title><style>*{box-sizing:border-box}body{margin:0;background:#0E1A2B;color:#F6F2E8;font:14px system-ui}header{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 20px;flex-wrap:wrap;border-bottom:1px solid #607695}nav{display:flex;gap:7px;align-items:center;flex-wrap:wrap}button,a{font:inherit;color:inherit;border:1px solid #607695;background:#16263D;border-radius:8px;padding:9px 12px;cursor:pointer;text-decoration:none}button[aria-pressed=true]{background:#D6F34E;color:#0E1A2B;border-color:#D6F34E}button:focus-visible,a:focus-visible{outline:3px solid #D6F34E;outline-offset:3px}body{height:100dvh;display:flex;flex-direction:column}main{display:flex;justify-content:flex-start;overflow:auto;flex:1;min-height:0;padding:12px}iframe{width:100%;max-width:none;flex-shrink:0;height:100%;border:1px solid #607695;border-radius:10px;background:#F6F2E8}small{color:#A9B7CB;display:block;margin-top:4px}@media(max-width:600px){header{padding:10px;gap:8px}main{padding:0}iframe{border-radius:0}small{display:none}button,a{padding:8px;font-size:12px}}</style></head><body><header><div><strong>OPTIVUE / RESPONSIVE REVIEW</strong><small>Integrated Packages · Ownership · Maintenance & Support</small></div><nav aria-label="Preview controls"><button data-size="360px" aria-pressed="false">360px</button><button data-size="390px" aria-pressed="false">390px</button><button data-size="430px" aria-pressed="false">430px</button><button data-size="1024px" aria-pressed="false">1024px</button><button data-size="1280px" aria-pressed="true">1280px</button><button data-size="1440px" aria-pressed="false">1440px</button><button data-size="1920px" aria-pressed="false">1920px</button><button data-size="768px" aria-pressed="false">Tablet · 768</button><button data-size="320px" aria-pressed="false">Small · 320</button><button data-size="375px" aria-pressed="false">Phone · 375</button><button data-theme="light" aria-pressed="true">Light</button><button data-theme="dark" aria-pressed="false">Dark</button><button data-page="/site.html">Overview</button><button data-page="/site.html#packages">Packages</button><button data-page="/privacy/">Privacy</button><button data-page="/terms/">Terms</button><button data-page="/cookies/">Cookies</button><button data-page="/estimator/">Estimator</button><button data-page="/thank-you/">Thank you</button><a href="/site.html" target="_blank" rel="noopener">Full screen ↗</a></nav></header><main><iframe title="Responsive Optivue website preview" id="preview" src="/site.html"></iframe></main><script>const frame=document.querySelector('#preview');document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>frame.src=b.dataset.page));document.querySelectorAll('[data-size]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('[data-size]').forEach(b=>b.setAttribute('aria-pressed',b===button));frame.style.width=button.dataset.size}));document.querySelectorAll('button[data-theme]').forEach(button=>button.addEventListener('click',()=>{try{localStorage.setItem('optivue-theme',button.dataset.theme)}catch{}document.querySelectorAll('button[data-theme]').forEach(b=>b.setAttribute('aria-pressed',b===button));frame.contentWindow.location.reload()}));let saved='light';try{saved=localStorage.getItem('optivue-theme')||'light'}catch{}document.querySelectorAll('button[data-theme]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.theme===saved));</script></body></html>
